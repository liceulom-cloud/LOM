  :root[data-theme="dark"]{

    --surface:#181d2a;
    --surface-2:#1f2536;
    --ink:#eef1f6;

    --border-strong:#39415a;
    --primary:#7fa3d6;

  body{

  header.top .school{

    color:var(--ink-dim);
    margin-top:2px;
  }

  /* ---------- class tabs ---------- */

    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  nav.classes button{
    all:unset;
    cursor:pointer;

    font-size:.84rem;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink-dim);

  nav.classes button[aria-current="true"]{
    color:var(--primary-ink);
    background:var(--primary);
    border-color:var(--primary);
  }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:780px){
    .layout{grid-template-columns:1fr;}
  }

  nav.modules{
    display:flex;
    flex-direction:column;
    gap:8px;
    position:sticky;
    top:20px;
  }
  @media (max-width:780px){
    nav.modules{
      position:static;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    }
  }
  nav.modules button{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);

  nav.modules button[aria-current="true"]{
    background:var(--surface);
    border-color:var(--border-strong);
    box-shadow:var(--shadow);

    font-weight:600;
    font-size:.82rem;
    color:var(--primary);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    width:34px; height:34px;
    display:grid; place-items:center;
    flex:none;

    color:var(--primary-ink);
    border-color:var(--primary);

  nav.modules .nav-title{
    font-size:.9rem;
    font-weight:600;
    line-height:1.25;
  }
  nav.modules .nav-status{
    font-size:.74rem;
    color:var(--ink-dim);
    margin-top:2px;
  }
  nav.modules .dot{

    display:inline-block;margin-right:5px;
    background:var(--ok);

    font-size:.85rem;
    color:var(--ink-dim);
    font-style:italic;
  }

  .empty-state{
    background:var(--surface);
    border:1px dashed var(--border-strong);
    border-radius:14px;
    padding:32px 24px;
    text-align:center;
    color:var(--ink-dim);
    font-size:.92rem;
  }
  .empty-state strong{color:var(--ink); font-weight:600;}

  .empty-class{
    background:var(--surface);

    border-radius:16px;
    padding:64px 24px;
    text-align:center;
    color:var(--ink-dim);

    font-weight:600;
    font-size:1.25rem;

  .pdf-modal{

    inset:0;
    z-index:100;

  }
  .pdf-modal-bar{

    align-items:center;
    gap:10px;
    padding:10px 14px;

    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex:none;
  }
  .pdf-modal-title{
    flex:1;
    min-width:0;
    font-size:.88rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pdf-modal-actions{ display:flex; gap:8px; flex:none; }
  .pdf-modal-btn{
    all:unset;
    cursor:pointer;
    font-family:"IBM Plex Sans", ui-sans-serif, sans-serif;
    font-size:.82rem;
    font-weight:600;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:7px 12px;
  }
  .pdf-modal-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .pdf-modal-close{ padding:7px 11px; }
  .pdf-modal-frame{
    flex:1;
    width:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--surface-2);
    box-sizing:border-box;
    padding:16px;
  }
  .pdf-modal-frame img{
    display:block;
    max-width:100%;
    height:auto;
    margin:0 auto 14px;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .pdf-modal-status{
    text-align:center;
    color:var(--ink-dim);
    font-size:.9rem;
    padding:48px 16px;
  }

  footer.note{
    margin-top:40px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:.8rem;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
</style>

  function renderPagesInto(container, hrefPdf){

        }));
      };
      container.appendChild(img);
    }

    pdfModalFrame.scrollTop = 0;
    renderPagesInto(pdfModalFrame, href);
  }
  function closeViewer(){
    viewerRequestId++;
    pdfModal.hidden = true;
    pdfModalFrame.innerHTML = "";
    document.body.style.overflow = "";
  }
  pdfModalClose.addEventListener("click", closeViewer);
  pdfModal.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !pdfModal.hidden) closeViewer(); });

  function handleFileClick(e){
    e.preventDefault();
    const href = e.currentTarget.getAttribute("href");
    const filename = e.currentTarget.dataset.download || href.split("/").pop();
    openViewer(href, filename);
  }

  const docIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
  const calIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;

  function renderClassTabs(activeClassId){
    classNavEl.innerHTML = classes.map(c => `
      <button data-class="${c.id}" aria-current="${c.id===activeClassId}">${c.label}</button>
    `).join("");
    classNavEl.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=> selectClass(btn.dataset.class));
    });
  }

  function renderModuleNav(cls, activeCode){
    return `<nav class="modules" id="moduleNav" aria-label="Discipline">` +
      cls.modules.map(m => `
        <button data-code="${m.code}" data-status="${m.status}" aria-current="${m.code===activeCode}">
          <span class="code">${m.code}</span>
          <span class="nav-text">
            <span class="nav-title">${m.title}</span>
            <span class="nav-status"><span class="dot"></span>${m.statusLabel}</span>
          </span>
        </button>
      `).join("") +
    `</nav>`;
  }

  function renderModulePanel(cls, m){
    const statusClass = m.status === "ok" ? "ok" : "wait";
    let links = "";
    if (m.curriculum) links += `<a href="${m.curriculum}" target="_blank" rel="noopener" data-download="Curriculum modul ${m.code}.pdf">${docIcon} Curriculum modul</a>`;
    if (m.planificare) links += `<a href="${m.planificare}" target="_blank" rel="noopener" data-download="Planificare calendaristica ${m.code}.pdf">${calIcon} Planificare calendaristică</a>`;
    if (m.extras) links += m.extras.map(r => `<a href="${r.href}" target="_blank" rel="noopener" data-download="${r.label}.pdf">${docIcon} ${r.label}</a>`).join("");

    const renderResRow = (cls, m, l, resources, partLabel) => `
          <div class="resources">
            ${resources.map(r => `<a class="resource" href="${r.href}" target="_blank" rel="noopener" data-download="${cls.id} ${m.code} L${l.nr}${partLabel ? " " + partLabel : ""} - ${r.label}.pdf"><span class="ext">${r.ext}</span>${r.label}</a>`).join("")}
          </div>`;

    let lectiiHtml;
    if (m.lectii.length){
      lectiiHtml = `<div class="lectii">` + m.lectii.map(l => `
        <article class="lectie">
          <div class="lectie-head">
            ${(l.title.startsWith("UI ") || l.noNr) ? "" : `<span class="lectie-nr">${String(l.nr).padStart(2,"0")}</span>`}
            <h3 class="lectie-title">${l.title}</h3>
          </div>
          ${l.resources && l.resources.length ? renderResRow(cls, m, l, l.resources, "") : ""}
          ${l.parts ? l.parts.map(p => `
            <div class="lectie-part">
              <div class="part-label">${p.label}</div>
              ${renderResRow(cls, m, l, p.resources, p.label)}
            </div>
          `).join("") : ""}
          ${(!l.resources || !l.resources.length) && !l.parts ? `<div class="lectie-empty">Materiale în pregătire pentru această lecție.</div>` : ""}
        </article>
      `).join("") + `</div>`;
    } else {
      lectiiHtml = `<div class="empty-state"><strong>Materialele pentru acest modul sunt în pregătire.</strong><br>Vor fi adăugate pe măsură ce lecțiile sunt finalizate.</div>`;
    }

    return `
      <div class="panel">
        <div class="module-head">
          <div class="eyebrow">${m.eyebrow || "Modul " + m.code} · ${cls.label}</div>
          <h2>${m.title}</h2>
          ${m.teacher ? `<div class="teacher-line">${m.teacher}</div>` : ""}
          <span class="status-pill ${statusClass}">${m.statusLabel}</span>
          ${links ? `<div class="module-links">${links}</div>` : ""}
        </div>
        ${lectiiHtml}
      </div>
    `;
  }

  function renderClassBody(cls, activeCode){
    if (!cls.modules.length){
      classBodyEl.innerHTML = `
        <div class="empty-class">
          <strong>${cls.label} — materiale în pregătire</strong>
          Disciplinele și lecțiile pentru această clasă vor fi adăugate pe site pe măsură ce sunt gata.
        </div>
      `;
      return;
    }
    const code = activeCode && cls.modules.some(m=>m.code===activeCode) ? activeCode : cls.modules[0].code;
    const m = cls.modules.find(x => x.code === code);
    classBodyEl.innerHTML = `
      <div class="layout">
        ${renderModuleNav(cls, code)}
        ${renderModulePanel(cls, m)}
      </div>
    `;
    classBodyEl.querySelectorAll("nav.modules button").forEach(btn=>{
      btn.addEventListener("click", ()=> {
        selectClass(cls.id, btn.dataset.code);
        const freshPanel = classBodyEl.querySelector(".panel");
        if (freshPanel) freshPanel.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });
    classBodyEl.querySelectorAll("a.resource, .module-links a").forEach(a=>{
      a.addEventListener("click", handleFileClick);
    });
  }

  function selectClass(classId, moduleCode){
    const cls = classes.find(c => c.id === classId) || classes[classes.length - 1];
    renderClassTabs(cls.id);
    renderClassBody(cls, moduleCode);
    try {
      localStorage.setItem("lom-last-class", cls.id);
      if (moduleCode) localStorage.setItem("lom-last-module-" + cls.id, moduleCode);
    } catch(e){}
  }

  let initialClass = "XII";
  let initialModule = null;
  try {
    const savedClass = localStorage.getItem("lom-last-class");
    if (savedClass && classes.some(c => c.id === savedClass)) initialClass = savedClass;
    const savedModule = localStorage.getItem("lom-last-module-" + initialClass);
    if (savedModule) initialModule = savedModule;
  } catch(e){}

  selectClass(initialClass, initialModule);

  document.getElementById("lastUpdated").textContent =
    "Ultima actualizare: " + new Date().toLocaleDateString("ro-RO", { year:"numeric", month:"long", day:"numeric" });
</script>

</body></html>
